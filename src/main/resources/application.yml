spring:
  application:
    name: taskflow
  datasource:
    url: jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080

jwt:
  secret: taskflow_super_secret_key_make_this_long_32chars_min
  expiration-ms: 86400000
